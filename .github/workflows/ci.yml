name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @school-admin/backend test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @school-admin/backend build

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: echo "Deploying to production server..."
        # 实际部署逻辑根据需求添加

  regression-test:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Regression Tests
        env:
          REGRESSION_BASE_URL: ${{ secrets.REGRESSION_API_URL || 'http://localhost:3000' }}
          REGRESSION_TEST_USER: ${{ secrets.REGRESSION_TEST_USER || 'parent_chen' }}
          REGRESSION_TEST_PASS: ${{ secrets.REGRESSION_TEST_PASS }}
        run: |
          chmod +x scripts/regression-test.sh
          ./scripts/regression-test.sh --json || true
          # 上传报告
          latest_report=$(ls -t /tmp/regression-report-*.json 2>/dev/null | head -1)
          if [ -f "$latest_report" ]; then
            echo "::group::Regression Test Report"
            cat "$latest_report" | jq .
            echo "::endgroup::"
          fi
        continue-on-error: true

      - name: Upload Regression Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_number }}
          path: /tmp/regression-report-*.json
          retention-days: 30
        continue-on-error: true

name: Project Status Automation

on:
  schedule:
    # 每2小时检查一次
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-status:
    runs-on: ubuntu-latest
    environment: write-all  # Required for gh cli permissions
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Issues Status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## 📊 项目状态检查 $(date '+%Y-%m-%d %H:%M') GMT+8" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          gh issue list --state open --limit 20 --json number,title,assignees --jq '"[\(.number)] \(.title)"' >> $GITHUB_STEP_SUMMARY

      - name: Check for Overdue Issues
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 检查超时的Issue并添加提醒
          OVERDUE=$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title | contains("截止") or contains("QA") or contains("验收"))')
          
          if [ -n "$OVERDUE" ]; then
            echo "⚠️ 发现可能超时的任务"
            # 可以添加自动评论等后续操作
          fi

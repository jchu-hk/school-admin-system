<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent 实时看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh
        }
        .container {
            max-width: 1400px;
            margin: 0 auto
        }
        h1 {
            text-align: center;
            color: #4ade80;
            margin-bottom: 30px;
            font-size: 2em
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1)
        }
        .card h2 {
            color: #4ade80;
            margin-bottom: 15px;
            font-size: 1.2em
        }
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px
        }
        .agent {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease
        }
        .agent.running {
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3)
        }
        .agent-icon {
            font-size: 2.5em;
            margin-bottom: 10px
        }
        .agent-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px
        }
        .agent-status {
            margin-bottom: 5px;
            font-size: 0.9em
        }
        .agent-task {
            font-size: 0.85em;
            color: #9ca3af
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1)
        }
        .stat-item:last-child {
            border-bottom: none
        }
        .refresh-info {
            text-align: center;
            margin-top: 30px;
            color: #9ca3af;
            font-size: 0.9em
        }
        .refresh-btn {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            border: 1px solid #4ade80;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px
        }
        .refresh-btn:hover {
            background: rgba(74, 222, 128, 0.3)
        }
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center
        }
        .loading {
            text-align: center;
            padding: 20px
        }
        .no-data {
            text-align: center;
            padding: 20px;
            color: #9ca3af
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Multi-Agent 实时看板</h1>

        <div id="error"></div>

        <div class="dashboard">
            <div class="card">
                <h2>👥 Agents 状态</h2>
                <div class="agent-grid" id="agents">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h2>📊 统计</h2>
                <div id="stats">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <div class="refresh-info">
            <span>🔄 自动刷新: 300秒</span>
            <span>|</span>
            <span>最后更新: <span id="lastUpdate">--:--:--</span></span>
            <span>|</span>
            <button class="refresh-btn" onclick="manualRefresh()">立即刷新</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            DASHBOARD_STATE_URL: 'https://raw.githubusercontent.com/jchu-hk/school-admin-system/main/agents/project-admin/dashboard-state.json',
            REFRESH_INTERVAL: 300000 // 5 minutes
        };

        let state = {
            dashboardState: null,
            isLoading: false
        };

        async function fetchDashboardState() {
            try {
                const response = await fetch(CONFIG.DASHBOARD_STATE_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to fetch dashboard state');
                const data = await response.json();
                state.dashboardState = data;
                render();
            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            } finally {
                state.isLoading = false;
            }
        }

        function render() {
            if (!state.dashboardState) return;

            // Render agents
            const agentsContainer = document.getElementById('agents');
            agentsContainer.innerHTML = state.dashboardState.agents.map(agent => `
                <div class="agent ${agent.status === 'running' ? 'running' : ''}">
                    <div class="agent-icon">${agent.icon}</div>
                    <div class="agent-name" style="color: ${agent.color}">${agent.name}</div>
                    <div class="agent-status">
                        ${agent.status === 'running' ? '🟢 运行中' : '⏸️ 空闲'}
                    </div>
                    <div class="agent-task">${agent.task}</div>
                </div>
            `).join('');

            // Render stats
            const statsContainer = document.getElementById('stats');
            const stats = state.dashboardState.stats;
            statsContainer.innerHTML = `
                <div class="stat-item">
                    <span>📌 Open Issues</span>
                    <span>${stats.openIssues}</span>
                </div>
                <div class="stat-item">
                    <span>📝 Commits (最近)</span>
                    <span>${stats.commits}</span>
                </div>
                <div class="stat-item">
                    <span>📅 今日 Commits</span>
                    <span>${stats.todayCommits}</span>
                </div>
                <div class="stat-item">
                    <span>🕐 7天活跃</span>
                    <span>${stats.recentActivity}</span>
                </div>
            `;

            // Update timestamp
            document.getElementById('lastUpdate').textContent = state.dashboardState.lastUpdate;

            // Hide error
            hideError();
        }

        function showError(message) {
            document.getElementById('error').innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        function hideError() {
            document.getElementById('error').innerHTML = '';
        }

        async function manualRefresh() {
            if (state.isLoading) return;
            state.isLoading = true;
            await fetchDashboardState();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            state.isLoading = true;
            fetchDashboardState();
            setInterval(manualRefresh, CONFIG.REFRESH_INTERVAL);
        });
    </script>
</body>
</html>

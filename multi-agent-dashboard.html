<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent 实时看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh
        }
        .container { max-width: 1400px; margin: 0 auto }
        h1 { text-align: center; color: #4ade80; margin-bottom: 30px; font-size: 2em }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1)
        }
        .card h2 { color: #4ade80; margin-bottom: 15px; font-size: 1.2em }
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px
        }
        .agent {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease
        }
        .agent.running {
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3)
        }
        .agent-icon { font-size: 2.5em; margin-bottom: 10px }
        .agent-name { font-weight: bold; font-size: 1.1em; margin-bottom: 5px }
        .agent-status { margin-bottom: 5px; font-size: 0.9em }
        .agent-task { font-size: 0.85em; color: #9ca3af }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1)
        }
        .stat-item:last-child { border-bottom: none }
        .refresh-info {
            text-align: center;
            margin-top: 30px;
            color: #9ca3af;
            font-size: 0.9em
        }
        .refresh-btn {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            border: 1px solid #4ade80;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px
        }
        .refresh-btn:hover { background: rgba(74, 222, 128, 0.3) }
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center
        }
        .loading { text-align: center; padding: 20px }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Multi-Agent 实时看板</h1>
        <div id="error"></div>
        <div class="dashboard">
            <div class="card">
                <h2>👥 Agents 状态</h2>
                <div class="agent-grid" id="agents"><div class="loading">加载中...</div></div>
            </div>
            <div class="card">
                <h2>📊 统计</h2>
                <div id="stats"><div class="loading">加载中...</div></div>
            </div>
        </div>
        <div class="refresh-info">
            <span>🔄 自动刷新: 300秒</span>
            <span>|</span>
            <span>最后更新: <span id="lastUpdate">--:--:--</span></span>
            <span>|</span>
            <button class="refresh-btn" onclick="location.reload()">刷新页面</button>
        </div>
    </div>

    <script>
        // 内嵌最新状态数据 (无 CORS 问题)
        const EMBEDDED_STATE = {"agents": [{"icon": "🧑💼", "name": "PM", "status": "idle", "task": "调度中枢", "color": "#fbbf24"}, {"icon": "🤖", "name": "DEV", "status": "idle", "task": "开发实现", "color": "#60a5fa"}, {"icon": "🔍", "name": "QA", "status": "idle", "task": "质量验收", "color": "#4ade80"}, {"icon": "🔧", "name": "DEVOPS", "status": "idle", "task": "上次: 0b573f3", "color": "#f97316"}, {"icon": "✓", "name": "CHECKER", "status": "idle", "task": "代码审查", "color": "#a855f7"}, {"icon": "🏗️", "name": "ARCH", "status": "idle", "task": "架构设计", "color": "#6b7280"}, {"icon": "📝", "name": "REQ", "status": "idle", "task": "需求分析", "color": "#ec4899"}], "stats": {"openIssues": 21, "commits": 20, "todayCommits": 5, "recentActivity": 20}, "lastUpdate": "2026-08-08 09:31:15"};

        function render(state) {
            if (!state) return;

            const agentsContainer = document.getElementById('agents');
            agentsContainer.innerHTML = state.agents.map(agent => `
                <div class="agent ${agent.status === 'running' ? 'running' : ''}">
                    <div class="agent-icon">${agent.icon}</div>
                    <div class="agent-name" style="color: ${agent.color}">${agent.name}</div>
                    <div class="agent-status">
                        ${agent.status === 'running' ? '🟢 运行中' : '⏸️ 空闲'}
                    </div>
                    <div class="agent-task">${agent.task}</div>
                </div>
            `).join('');

            const statsContainer = document.getElementById('stats');
            const stats = state.stats;
            statsContainer.innerHTML = `
                <div class="stat-item"><span>📌 Open Issues</span><span>${stats.openIssues}</span></div>
                <div class="stat-item"><span>📝 Commits (最近)</span><span>${stats.commits}</span></div>
                <div class="stat-item"><span>📅 今日 Commits</span><span>${stats.todayCommits}</span></div>
                <div class="stat-item"><span>🕐 7天活跃</span><span>${stats.recentActivity}</span></div>
            `;

            document.getElementById('lastUpdate').textContent = state.lastUpdate;
            document.getElementById('error').innerHTML = '';
        }

        // 使用内嵌数据
        render(EMBEDDED_STATE);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Multi-Agent Dashboard</title>
<style>
body {font-family:system-ui,-apple-system,sans-serif;margin:0;padding:20px;background:#f5f5f5}
h1 {margin-bottom:10px}
h2 {margin-top:0;font-size:18px;color:#444}
.card {background:#fff;border-radius:8px;padding:20px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.stats {display:flex;gap:20px;margin-bottom:20px}
.stat-box {flex:1;background:#f9f9f9;padding:15px;border-radius:6px}
.stat-label {font-size:12px;color:#888;text-transform:uppercase}
.stat-value {font-size:24px;font-weight:600;margin-top:5px}
.agent-row {display:grid;grid-template-columns:80px 60px 80px 1fr 80px;gap:10px;padding:8px;border-bottom:1px solid #eee;align-items:center}
.agent-row:last-child {border-bottom:none}
.agent-name {font-weight:600;color:#333}
.issue-id {font-family:monospace;color:#555}
.status {font-size:11px;padding:2px 8px;border-radius:4px;text-transform:uppercase;font-weight:600}
.status.running {background:#fff3cd;color:#856404}
.status.done {background:#d4edda;color:#155724}
.status.failed {background:#f8d7da;color:#721c24}
.message {white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#555}
.age {font-size:11px;color:#888;font-family:monospace}
.meta {font-size:11px;color:#888;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h1>Multi-Agent Dashboard</h1>
<div class="stats">
<div class="stat-box"><div class="stat-label">Total Agents</div><div class="stat-value">0</div></div>
<div class="stat-box"><div class="stat-label">Running</div><div class="stat-value">0</div></div>
<div class="stat-box"><div class="stat-label">Done</div><div class="stat-value">0</div></div>
<div class="stat-box"><div class="stat-label">Failed</div><div class="stat-value">0</div></div>
</div>
<h2>Agent Status</h2>
<div class="agents"><div class="agent-row"><span>No active agent heartbeats</span></div></div>
<div class="meta">Last updated: 2026-06-29T02:11:54.626439+00:00 UTC</div>
</div>
</body>
</html>

# Prometheus Alert Rules for School Admin System
# 参考: SPEC-SYSTEM-DESIGN.md v1.7.0 Section 7.4 告警策略 & Section 9 F-OPS

groups:
  # ===========================================
  # Critical Alerts - 立即通知，15分钟内响应
  # ===========================================
  - name: critical_alerts
    rules:
      # F-OPS-009: 服务宕机监控
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "服务宕机"
          description: "服务 {{ $labels.job }} 实例 {{ $labels.instance }} 已宕机超过1分钟"
          runbook_url: "https://wiki.school-admin.hk/runbooks/service-down"
      
      # F-OPS-009: HTTP 5xx 错误率
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[1m]) > 0.05
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "HTTP 5xx错误率超过5%"
          description: "服务 {{ $labels.service }} 5xx错误率为 {{ $value | humanizePercentage }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/high-error-rate"
      
      # F-OPS-001: 数据库连接池使用率
      - alert: DatabasePoolHigh
        expr: postgres_connection_usage > 0.8
        for: 5m
        labels:
          severity: critical
          team: dba
        annotations:
          summary: "数据库连接池使用率超过80%"
          description: "PostgreSQL连接池使用率为 {{ $value | humanizePercentage }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/db-pool-high"
      
      # F-OPS-001: WAL积压过高
      - alert: WALBacklogHigh
        expr: postgres_wal_archive_backlog > 500
        for: 1m
        labels:
          severity: critical
          team: dba
        annotations:
          summary: "WAL积压超过500MB"
          description: "PostgreSQL WAL积压大小为 {{ $value }}MB，可能影响主从复制"
          runbook_url: "https://wiki.school-admin.hk/runbooks/wal-backlog-high"
      
      # F-OPS-005: 审计日志断层检测
      - alert: AuditLogGapDetected
        expr: audit_log_sequence_gap_size > 0
        for: 1m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "审计日志序列号断层检测"
          description: "检测到审计日志序列号断层大小为 {{ $value }}，可能存在日志丢失"
          runbook_url: "https://wiki.school-admin.hk/runbooks/audit-log-gap"
      
      # F-OPS-008: 未授权DDL操作
      - alert: UnauthorizedDDLAttempt
        expr: ddl_unauthorized_attempts_total > 0
        for: 1m
        labels:
          severity: critical
          team: dba
        annotations:
          summary: "检测到未授权DDL操作尝试"
          description: "有 {{ $value }} 次未授权DDL操作尝试"
          runbook_url: "https://wiki.school-admin.hk/runbooks/unauthorized-ddl"
      
      # F-OPS-004: 灾难恢复RTO超标
      - alert: DRRecoveryRTOExceeded
        expr: dr_recovery_rto_actual_seconds > 14400
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "灾难恢复RTO超过4小时目标"
          description: "实际RTO为 {{ $value | humanizeDuration }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/dr-rto-exceeded"
      
      # F-OPS-004: 灾难恢复RPO超标
      - alert: DRRecoveryRPOExceeded
        expr: dr_recovery_rpo_actual_seconds > 3600
        for: 1m
        labels:
          severity: critical
          team: dba
        annotations:
          summary: "灾难恢复RPO超过1小时目标"
          description: "实际RPO为 {{ $value | humanizeDuration }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/dr-rpo-exceeded"
      
      # F-OPS-007: 敏感字段访问异常（Critical级别）
      - alert: SensitiveFieldAccessCritical
        expr: sensitive_field_access_rate{field_name=~"student_hkid|parent_financial|student_health"} > 50
        for: 1m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "敏感字段访问频率严重异常"
          description: "字段 {{ $labels.field_name }} 访问频率达到 {{ $value }}次/小时，超过安全阈值"
          runbook_url: "https://wiki.school-admin.hk/runbooks/sensitive-access-critical"

  # ===========================================
  # Warning Alerts - Slack通知，2小时内响应
  # ===========================================
  - name: warning_alerts
    rules:
      # F-OPS-009: API响应延迟
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "P95响应时间超过2秒"
          description: "服务 {{ $labels.service }} P95响应时间为 {{ $value }}秒"
          runbook_url: "https://wiki.school-admin.hk/runbooks/high-latency"
      
      # F-OPS-009: Redis缓存命中率低
      - alert: CacheHitLow
        expr: redis_cache_hit_rate < 0.6
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "缓存命中率低于60%"
          description: "Redis缓存命中率为 {{ $value | humanizePercentage }}，可能需要优化缓存策略"
          runbook_url: "https://wiki.school-admin.hk/runbooks/cache-hit-low"
      
      # F-OPS-002: SSL证书即将过期
      - alert: CertExpiringSoon
        expr: ssl_cert_days_remaining < 30
        for: 1h
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "SSL证书30天内到期"
          description: "域名 {{ $labels.domain }} 的SSL证书将在 {{ $value }} 天后到期"
          runbook_url: "https://wiki.school-admin.hk/runbooks/cert-expiring"
      
      # F-OPS-006: Coze API配额警告
      - alert: CozeQuotaUsageWarning
        expr: coze_api_quota_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "Coze API配额使用率超过80%"
          description: "当前配额使用率为 {{ $value | humanizePercentage }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/coze-quota-warning"
      
      # F-OPS-006: Coze API配额严重
      - alert: CozeQuotaUsageCritical
        expr: coze_api_quota_usage_percent > 95
        for: 2m
        labels:
          severity: critical
          team: ai
        annotations:
          summary: "Coze API配额>95%，自动切换备用方案"
          description: "当前配额使用率为 {{ $value | humanizePercentage }}，备用方案已激活"
          runbook_url: "https://wiki.school-admin.hk/runbooks/coze-quota-critical"
      
      # F-OPS-005: 审计日志积压
      - alert: AuditLogBacklogHigh
        expr: audit_log_backlog_size > 1000
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "审计日志Kafka消费积压超过1000"
          description: "当前积压数量为 {{ $value }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/audit-backlog"
      
      # F-OPS-005: 审计日志积压严重
      - alert: AuditLogBacklogCritical
        expr: audit_log_backlog_size > 5000
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "审计日志Kafka消费积压超过5000"
          description: "当前积压数量为 {{ $value }}，需要立即处理"
          runbook_url: "https://wiki.school-admin.hk/runbooks/audit-backlog-critical"
      
      # F-OPS-007: 敏感字段访问异常（Warning级别）
      - alert: SensitiveFieldAccessWarning
        expr: sensitive_field_access_rate{field_name=~"exam_detail|emergency_contact"} > 20
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "敏感字段访问频率异常"
          description: "字段 {{ $labels.field_name }} 访问频率达到 {{ $value }}次/小时"
          runbook_url: "https://wiki.school-admin.hk/runbooks/sensitive-access-warning"
      
      # F-OPS-008: DDL待审批
      - alert: DDLPendingApproval
        expr: ddl_approval_pending > 0
        for: 30m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "有DDL变更待审批"
          description: "当前有 {{ $value }} 个DDL变更申请待审批"
          runbook_url: "https://wiki.school-admin.hk/runbooks/ddl-pending"
      
      # F-OPS-004: 备份过期警告
      - alert: BackupAgeWarning
        expr: dr_backup_age_seconds > 7200
        for: 1h
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "最新数据库备份已过期"
          description: "最新备份距今 {{ $value | humanizeDuration }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/backup-age"
      
      # F-OPS-001: 数据库连接池警告
      - alert: DatabasePoolWarning
        expr: postgres_connection_usage > 0.6
        for: 10m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "数据库连接池使用率超过60%"
          description: "PostgreSQL连接池使用率为 {{ $value | humanizePercentage }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/db-pool-warning"
      
      # F-OPS-009: 磁盘空间警告
      - alert: DiskSpaceWarning
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.2
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "磁盘空间剩余不足20%"
          description: "挂载点 {{ $labels.mountpoint }} 剩余空间为 {{ $value | humanizePercentage }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/disk-space"
      
      # F-OPS-009: 内存使用警告
      - alert: MemoryUsageHigh
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "内存使用率超过85%"
          description: "节点 {{ $labels.instance }} 内存使用率为 {{ $value | humanizePercentage }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/memory-high"
      
      # F-OPS-009: CPU使用警告
      - alert: CPUUsageHigh
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "CPU使用率超过80%"
          description: "节点 {{ $labels.instance }} CPU使用率为 {{ $value | humanize }}"
          runbook_url: "https://wiki.school-admin.hk/runbooks/cpu-high"
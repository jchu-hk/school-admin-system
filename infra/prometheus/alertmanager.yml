global:
  resolve_timeout: 5m
  # 企业微信Webhook配置
  wechat_api_url: 'https://qyapi.weixin.qq.com/cgi-bin/'
  # 以下为占位值，需替换为真实的企业微信应用凭证
  # - wechat_api_corp_id: 企业微信企业ID (Corp ID)，在「我的企业」页面获取
  # - wechat_api_secret: 自建应用的Secret，在「应用管理」→「自建」应用的详情页获取
  # - agent_id: 应用的AgentId，在应用详情页获取
  wechat_api_corp_id: 'YOUR_CORP_ID'
  wechat_api_secret: 'YOUR_APP_SECRET'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'wechat-work'

receivers:
- name: 'wechat-work'
  wechat_configs:
  - send_resolved: true
    agent_id: 'YOUR_AGENT_ID'
    to_user: '@all'
    message: |
      {{ range .Alerts }}
      🚨 **{{ .Status | toUpper }}: {{ .Labels.alertname }}**
      **Severity:** {{ .Labels.severity }}
      **Summary:** {{ .Annotations.summary }}
      **Description:** {{ .Annotations.description }}
      **Actionable Steps:** {{ .Annotations.actionable_steps }}
      **Starts At:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
      {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']

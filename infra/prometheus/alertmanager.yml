global:
  resolve_timeout: 5m
  # 企业微信Webhook配置
  wechat_api_url: 'https://qyapi.weixin.qq.com/cgi-bin/'
  wechat_api_corp_id: 'YOUR_CORP_ID'
  wechat_api_secret: 'YOUR_APP_SECRET'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'wechat-work'

receivers:
- name: 'wechat-work'
  wechat_configs:
  - send_resolved: true
    agent_id: 'YOUR_AGENT_ID'
    to_user: '@all'
    message: |
      {{ range .Alerts }}
      🚨 **{{ .Status | toUpper }}: {{ .Labels.alertname }}**
      **Severity:** {{ .Labels.severity }}
      **Summary:** {{ .Annotations.summary }}
      **Description:** {{ .Annotations.description }}
      **Actionable Steps:** {{ .Annotations.actionable_steps }}
      **Starts At:** {{ .StartsAt.Format "2006-01-02 15:04:05" }}
      {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']

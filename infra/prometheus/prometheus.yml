# Prometheus Configuration for Smart School Admin

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "rules/*.yml"

scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API (NestJS with prom-client)
  - job_name: 'school-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:3000']
    scrape_interval: 10s

  # PostgreSQL Database Metrics (via postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
    scrape_interval: 10s

  # Docker Container Metrics (custom host-based exporter via Docker gateway)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['172.19.0.1:9393']
    scrape_interval: 15s

  # Node Exporter - Host System Metrics
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
    scrape_interval: 15s

  # Docker Containers View (separate job for container grouping)
  - job_name: 'docker-containers'
    static_configs:
      - targets: ['172.19.0.1:9393']
    scrape_interval: 15s
    metric_relabel_configs:
      - source_labels: [name]
        target_label: docker_service
        regex: (.+)
        replacement: '${1}'

# Prometheus Configuration for Smart School Admin

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API (NestJS with prom-client)
  - job_name: 'school-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['172.19.0.4:3000']
    scrape_interval: 10s

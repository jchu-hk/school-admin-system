# ============================================================
# Production overrides for docker-compose
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================
version: '3.8'

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    environment:
      POSTGRES_MAX_CONNECTIONS: "200"

  redis:
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      args:
        NODE_ENV: production
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: always
    volumes:
      # 生产环境挂载数据库备份目录（宿主绑定，nestJS 可写，Issue #309）
      # 注：此列表会与 base compose 的 dev 源码 mount 合并；实际部署以 docker run 为准
      - type: bind
        source: /var/backups/school_admin
        target: /var/backups/school_admin
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      TZ: Asia/Hong_Kong
      DB_SSL: "true"
      SESSION_SECURE_COOKIE: "true"
      # 备份目录（宿主绑定卷，nestJS 可写，避免 /var/backups 属 root 的 EACCES）
      BACKUP_DIR: /var/backups/school_admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    restart: always
    volumes: []

  prometheus:
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - /var/lib/prometheus:/prometheus

  grafana:
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_ALERTING_ENABLED: "true"

; Cloudflared Tunnel Supervisor配置
; 用于自动管理和监控Cloudflare Tunnel进程

; Backend Tunnel (端口3000)
[program:cloudflared-backend]
command=/usr/local/bin/cloudflared tunnel --url http://localhost:3000
directory=/workspace/projects/workspace
autostart=true
autorestart=true
startretries=5
exitcodes=0
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspace/projects/workspace/logs/supervisor-cloudflared-backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
user=root
priority=100
; 重启延迟，避免频繁重启
autorestart_delay_seconds=30

; Frontend Tunnel (端口8080)
[program:cloudflared-frontend]
command=/usr/local/bin/cloudflared tunnel --url http://localhost:8080
directory=/workspace/projects/workspace
autostart=true
autorestart=true
startretries=5
exitcodes=0
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/workspace/projects/workspace/logs/supervisor-cloudflared-frontend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
user=root
priority=101
autorestart_delay_seconds=30

; Tunnel监控服务
[program:cloudflared-monitor]
command=/workspace/projects/workspace/infra/cloudflared-manager.sh monitor
directory=/workspace/projects/workspace
autostart=true
autorestart=true
startretries=3
exitcodes=0
redirect_stderr=true
stdout_logfile=/workspace/projects/workspace/logs/supervisor-cloudflared-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
user=root
priority=50
; 监控进程优先级较低，确保Tunnel先启动
startsecs=5
stopwaitsecs=10
